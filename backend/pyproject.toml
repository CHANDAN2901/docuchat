[project]
name = "docuchat-backend"
version = "0.1.0"
description = "Chat with your documents — RAG backend with per-user private libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.10.0",
    "pydantic[email]>=2.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "bcrypt>=4.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=1.24.0",
    "qdrant-client>=1.9.0",
    "langchain-qdrant>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
